<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Registro | Plataforma de Servicios Sociales</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header>
    <h1>Plataforma de Servicios Sociales</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="buscador.html">Buscar servicios</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Crear Cuenta</h2>
      <form>
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Correo electrónico:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="password2">Confirmar contraseña:</label><br>
        <input type="password" id="password2" name="password2" required><br><br>

        <button type="submit">Registrarme</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Plataforma de Servicios Sociales</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
