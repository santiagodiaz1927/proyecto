  <main>
    <section>
      <h2>Buscar Servicios</h2>

      <form>
        <label for="busqueda">Buscar por palabra clave:</label><br>
        <input type="text" id="busqueda" name="busqueda"><br><br>

        <label for="categoria">Categoría:</label><br>
        <select id="categoria" name="categoria">
          <option value="salud">Salud</option>
          <option value="educacion">Educación</option>
          <option value="vivienda">Vivienda</option>
          <option value="empleo">Empleo</option>
        </select><br><br>

        <label for="ubicacion">Ubicación:</label><br>
        <input type="text" id="ubicacion" name="ubicacion" placeholder="Ciudad o barrio"><br><br>

        <button type="submit">Buscar</button>
      </form>

      <h3>Resultados</h3>
      <ul>
        <li><a href="categoria.html">Ver servicios de Salud</a></li>
        <li><a href="categoria.html">Ver servicios de Educación</a></li>
